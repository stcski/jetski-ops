<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jet Ski Ops · NY</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap');
:root{--ocean:#0077b6;--deep:#023e8a;--sky:#48cae4;--foam:#e0f4ff;--green:#2dc653;--red:#e63946;--orange:#f4845f;--yellow:#ffc107;--gray:#8d99ae;--dark:#0d1b2a;--border:#e2ecf5;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Barlow',sans-serif;background:#f0f7ff;color:var(--dark);min-height:100vh;padding-bottom:calc(110px + var(--sb));}
.hdr{background:linear-gradient(135deg,var(--deep),var(--ocean));padding:calc(var(--st)+16px) 20px 20px;position:sticky;top:0;z-index:100;}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.brand{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;color:#fff;}
.brand-sub{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;letter-spacing:2px;color:var(--sky);text-transform:uppercase;display:block;margin-top:-2px;}
.sbadge{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:5px 12px;font-size:11px;font-weight:600;color:#fff;display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap;}
.sdot{width:7px;height:7px;border-radius:50%;background:#aaa;flex-shrink:0;}
.sdot.ok{background:var(--green);}.sdot.err{background:var(--red);}.sdot.spin{background:var(--sky);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.tabs{display:flex;background:rgba(255,255,255,.1);border-radius:10px;padding:3px;gap:3px;}
.tab{flex:1;padding:8px 0;border:none;border-radius:8px;background:transparent;color:rgba(255,255,255,.6);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;cursor:pointer;}
.tab.active{background:#fff;color:var(--deep);}
.content{padding:16px 16px 0;}
.page{display:none;}.page.active{display:block;}
.pbar-wrap{background:#dceeff;border-radius:20px;height:6px;margin-bottom:16px;overflow:hidden;}
.pbar{height:100%;background:linear-gradient(90deg,var(--sky),var(--ocean));border-radius:20px;transition:width .4s;}
.sec{margin-bottom:20px;}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px;}
.sec-title{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gray);}
.sec-prog{font-size:12px;font-weight:600;color:var(--ocean);}
.card{background:#fff;border-radius:14px;margin-bottom:8px;border:1.5px solid var(--border);overflow:hidden;}
.card.done{border-color:#c8f0d8;background:#f6fef9;}
.card-row{display:flex;align-items:center;padding:14px 16px;gap:14px;cursor:pointer;user-select:none;}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff;font-size:13px;}
.card.done .chk{background:var(--green);border-color:var(--green);color:#fff;}
.ci{flex:1;min-width:0;}
.cn{font-size:15px;font-weight:600;color:var(--dark);margin-bottom:2px;line-height:1.3;}
.card.done .cn{color:#4caf7d;text-decoration:line-through;text-decoration-color:#a8d5bc;}
.cm{font-size:12px;color:var(--gray);font-weight:500;}
.card.done .cm{color:#a8d5bc;}
.caret{font-size:18px;color:var(--gray);transition:transform .2s;flex-shrink:0;}
.card.open .caret{transform:rotate(180deg);}
.detail{display:none;padding:0 16px 14px;border-top:1px solid var(--border);}
.card.open .detail{display:block;}
.dnote{font-size:13px;color:#5a6a7a;line-height:1.5;margin-bottom:12px;padding-top:10px;}
/* MEDIA */
.task-photo{width:100%;border-radius:10px;margin-bottom:12px;max-height:220px;object-fit:cover;display:block;}
.task-video{width:100%;border-radius:10px;margin-bottom:12px;aspect-ratio:16/9;border:none;}
.media-btn{display:flex;align-items:center;gap:8px;background:var(--foam);border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ocean);text-decoration:none;width:100%;}
.slbl{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gray);margin-bottom:6px;}
.npicker{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.nbtn{border:2px solid var(--border);background:var(--foam);border-radius:10px;padding:12px 8px;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:var(--dark);cursor:pointer;text-align:center;}
.nbtn.sel{background:var(--ocean);border-color:var(--ocean);color:#fff;}
.cfmbtn{width:100%;background:var(--green);color:#fff;border:none;border-radius:10px;padding:13px;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;cursor:pointer;display:none;}
.cfmbtn.show{display:block;}
.dby{font-size:12px;color:#4caf7d;font-weight:600;margin-top:4px;}
.undobtn{background:var(--gray);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;cursor:pointer;width:100%;margin-top:8px;}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.hbox{background:var(--foam);border:1.5px solid var(--border);border-radius:10px;padding:8px;}
.hlbl{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--gray);text-transform:uppercase;margin-bottom:4px;}
.hinp{width:100%;border:none;background:transparent;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:var(--dark);outline:none;text-align:center;}
.co-bar{background:#fff;border-radius:14px;border:1.5px solid var(--border);padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;}
.co-lbl{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gray);white-space:nowrap;}
.co-sel{flex:1;border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;font-family:'Barlow',sans-serif;font-size:15px;font-weight:600;color:var(--dark);background:var(--foam);outline:none;-webkit-appearance:none;}
.empty{text-align:center;padding:50px 20px;color:var(--gray);}
.hday{margin-bottom:20px;}
.hday-hdr{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gray);margin-bottom:8px;}
.hentry{background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:6px;border:1.5px solid var(--border);display:flex;align-items:center;gap:10px;}
.hdot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;}
.hdot.w{background:var(--ocean);}
.htask{flex:1;font-size:14px;font-weight:600;}
.hwho{font-size:12px;color:var(--gray);}
.htime{font-size:11px;color:var(--gray);flex-shrink:0;}
/* MAINTENANCE */
.maint-ski-card{background:#fff;border-radius:14px;margin-bottom:8px;border:1.5px solid var(--border);overflow:hidden;cursor:pointer;}
.maint-ski-card.overdue{border-color:#ffd5d5;}
.maint-ski-card.due-soon{border-color:#ffe082;}
.maint-ski-card.ok{border-color:#c8f0d8;}
.maint-ski-row{display:flex;align-items:center;padding:14px 16px;gap:12px;}
.maint-ski-num{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;color:var(--ocean);width:36px;flex-shrink:0;text-align:center;}
.maint-ski-info{flex:1;min-width:0;}
.maint-ski-name{font-size:15px;font-weight:700;color:var(--dark);margin-bottom:3px;}
.maint-ski-hrs{font-size:12px;color:var(--gray);}
.pill{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;border-radius:20px;padding:3px 8px;white-space:nowrap;}
.pill.overdue{background:#fff0f0;color:var(--red);}
.pill.due-soon{background:#fff8e1;color:#f57c00;}
.pill.ok{background:#f0fff4;color:#2d6a4f;}
.maint-detail{display:none;padding:0 16px 16px;border-top:1px solid var(--border);}
.maint-ski-card.open .maint-detail{display:block;}
.maint-ski-card.open .caret{transform:rotate(180deg);}
.service-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
.service-row:last-child{border-bottom:none;}
.service-name{font-size:14px;font-weight:600;color:var(--dark);}
.service-info{font-size:12px;color:var(--gray);margin-top:2px;}
.service-due{font-size:12px;font-weight:700;}
.service-due.overdue{color:var(--red);}
.service-due.due-soon{color:#f57c00;}
.service-due.ok{color:#2d6a4f;}
.log-service-btn{background:var(--ocean);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
.service-history{margin-top:10px;background:var(--foam);border-radius:10px;padding:10px 12px;}
.service-history-title{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gray);margin-bottom:6px;}
.service-history-row{font-size:12px;color:var(--dark);padding:3px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;}
.service-history-row:last-child{border-bottom:none;}
.maint-hrs-bar{display:flex;align-items:center;gap:10px;padding:12px 0 8px;}
.maint-hrs-lbl{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--gray);white-space:nowrap;}
.maint-hrs-inp{border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:var(--dark);background:var(--foam);outline:none;width:100px;text-align:center;}
.maint-hrs-save{background:var(--ocean);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
/* ADMIN */
.pin-screen{display:flex;flex-direction:column;align-items:center;padding:40px 20px;}
.pin-title{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;color:var(--deep);margin-bottom:6px;}
.pin-sub{font-size:14px;color:var(--gray);margin-bottom:32px;text-align:center;}
.pdots{display:flex;gap:14px;margin-bottom:28px;}
.pdot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);background:#fff;}
.pdot.f{background:var(--ocean);border-color:var(--ocean);}
.pdot.e{background:var(--red);border-color:var(--red);}
.ppad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:240px;}
.pkey{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:18px;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;color:var(--dark);cursor:pointer;text-align:center;user-select:none;}
.pkey:active{background:var(--foam);transform:scale(.95);}
.perr{font-size:13px;color:var(--red);font-weight:600;margin-top:16px;min-height:20px;text-align:center;}
.adm{padding-top:4px;}
.asec{margin-bottom:24px;}
.asec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.asec-title{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--deep);}
.addbtn{background:var(--ocean);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
.acard{background:#fff;border-radius:12px;border:1.5px solid var(--border);margin-bottom:8px;padding:12px 14px;display:flex;align-items:flex-start;gap:10px;}
.acard-info{flex:1;min-width:0;}
.acard-name{font-size:14px;font-weight:600;margin-bottom:2px;}
.acard-meta{font-size:12px;color:var(--gray);}
.acard-acts{display:flex;gap:6px;flex-shrink:0;}
.aact{border:none;border-radius:7px;padding:6px 10px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;cursor:pointer;}
.ea{background:var(--foam);color:var(--ocean);border:1.5px solid #b8dcf5;}
.da{background:#fff0f0;color:var(--red);border:1.5px solid #ffd5d5;}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-top:4px;}
.chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--border);border-radius:20px;padding:8px 14px;font-weight:600;font-size:14px;}
.chipdel{background:none;border:none;color:var(--gray);font-size:18px;cursor:pointer;padding:0;line-height:1;}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.srow{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:8px 12px;}
.snum{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--gray);width:24px;flex-shrink:0;}
.sinp{flex:1;border:none;outline:none;font-size:14px;font-weight:600;color:var(--dark);background:transparent;min-width:0;}
.abtn{width:100%;background:#f0f4f8;color:var(--dark);border:1.5px solid var(--border);border-radius:10px;padding:12px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:10px;display:block;text-align:center;text-decoration:none;}
.alogout{width:100%;background:#f0f4f8;color:var(--gray);border:none;border-radius:10px;padding:13px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;}
.flbl{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gray);margin-bottom:5px;}
.finp{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:11px 13px;font-family:'Barlow',sans-serif;font-size:15px;color:var(--dark);background:var(--foam);outline:none;margin-bottom:14px;}
.finp:focus{border-color:var(--ocean);background:#fff;}
textarea.finp{resize:none;min-height:70px;}
.fsel{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:11px 13px;font-family:'Barlow',sans-serif;font-size:15px;color:var(--dark);background:var(--foam);outline:none;margin-bottom:14px;-webkit-appearance:none;}
.moverlay{display:none;position:fixed;inset:0;background:rgba(2,20,50,.5);z-index:200;align-items:flex-end;justify-content:center;}
.moverlay.open{display:flex;}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:24px 20px calc(24px + var(--sb));width:100%;max-height:90vh;overflow-y:auto;}
.mtitle{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;color:var(--deep);margin-bottom:20px;}
.macts{display:flex;gap:10px;margin-top:4px;}
.msave{flex:1;background:var(--ocean);color:#fff;border:none;border-radius:10px;padding:14px;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;cursor:pointer;}
.mcancel{flex:1;background:#f0f4f8;color:var(--gray);border:none;border-radius:10px;padding:14px;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;cursor:pointer;}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);z-index:100;padding-bottom:calc(8px + var(--sb));}
.bnav-row{display:flex;}
.bnav-divider{height:1px;background:var(--border);margin:0 16px;}
.nbtn2{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:transparent;cursor:pointer;padding:8px 4px;}
.nicon{font-size:18px;}
.nlbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gray);}
.nbtn2.active .nlbl{color:var(--ocean);}
.toast{position:fixed;bottom:calc(120px + var(--sb));left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;border-radius:20px;padding:10px 20px;font-size:13px;font-weight:600;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <div><div class="brand">🌊 JET SKI OPS</div><span class="brand-sub">New York</span></div>
    <div class="sbadge" id="sbadge" onclick="manualSync()"><div class="sdot" id="sdot"></div><span id="slbl">Loading…</span></div>
  </div>
  <div class="tabs">
    <button class="tab active" id="tab-daily" onclick="showPage('daily')">Daily</button>
    <button class="tab" id="tab-mon" onclick="showPage('mon')">Mon</button>
    <button class="tab" id="tab-tue" onclick="showPage('tue')">Tue</button>
    <button class="tab" id="tab-wed" onclick="showPage('wed')">Wed</button>
    <button class="tab" id="tab-thu" onclick="showPage('thu')">Thu</button>
    <button class="tab" id="tab-maint" onclick="showPage('maint')">Maint</button>
    <button class="tab" id="tab-history" onclick="showPage('history')">Log</button>
    <button class="tab" id="tab-admin" onclick="showPage('admin')">Admin</button>
  </div>
</div>

<div class="content">
  <div class="page active" id="page-daily"><div class="pbar-wrap"><div class="pbar" id="pbar-daily" style="width:0%"></div></div><div id="tasks-daily"></div></div>
  <div class="page" id="page-mon"><div class="pbar-wrap"><div class="pbar" id="pbar-mon" style="width:0%"></div></div><div id="tasks-mon"></div></div>
  <div class="page" id="page-tue"><div class="pbar-wrap"><div class="pbar" id="pbar-tue" style="width:0%"></div></div><div id="tasks-tue"></div></div>
  <div class="page" id="page-wed"><div class="pbar-wrap"><div class="pbar" id="pbar-wed" style="width:0%"></div></div><div id="tasks-wed"></div></div>
  <div class="page" id="page-thu"><div class="pbar-wrap"><div class="pbar" id="pbar-thu" style="width:0%"></div></div><div id="tasks-thu"></div></div>
  <div class="page" id="page-maint"><div id="maint-content"></div></div>
  <div class="page" id="page-history"><div id="hist-log"></div></div>
  <div class="page" id="page-admin">
    <div id="pin-gate">
      <div class="pin-screen">
        <div class="pin-title">🔒 Admin</div>
        <div class="pin-sub">Enter your PIN to manage tasks and settings</div>
        <div class="pdots" id="pdots"><div class="pdot"></div><div class="pdot"></div><div class="pdot"></div><div class="pdot"></div></div>
        <div class="ppad">
          <button class="pkey" onclick="pp('1')">1</button><button class="pkey" onclick="pp('2')">2</button><button class="pkey" onclick="pp('3')">3</button>
          <button class="pkey" onclick="pp('4')">4</button><button class="pkey" onclick="pp('5')">5</button><button class="pkey" onclick="pp('6')">6</button>
          <button class="pkey" onclick="pp('7')">7</button><button class="pkey" onclick="pp('8')">8</button><button class="pkey" onclick="pp('9')">9</button>
          <button class="pkey" style="visibility:hidden"></button><button class="pkey" onclick="pp('0')">0</button><button class="pkey" onclick="pd()">⌫</button>
        </div>
        <div class="perr" id="perr"></div>
      </div>
    </div>
    <div id="adm-content" style="display:none" class="adm">
      <div class="asec"><div class="asec-hdr"><div class="asec-title">Daily Tasks</div><button class="addbtn" onclick="openModal('task','daily',null)">+ Add</button></div><div id="adm-daily"></div></div>
      <div class="asec"><div class="asec-hdr"><div class="asec-title">Monday Tasks</div><button class="addbtn" onclick="openModal('task','mon',null)">+ Add</button></div><div id="adm-mon"></div></div>
      <div class="asec"><div class="asec-hdr"><div class="asec-title">Tuesday Tasks</div><button class="addbtn" onclick="openModal('task','tue',null)">+ Add</button></div><div id="adm-tue"></div></div>
      <div class="asec"><div class="asec-hdr"><div class="asec-title">Wednesday Tasks</div><button class="addbtn" onclick="openModal('task','wed',null)">+ Add</button></div><div id="adm-wed"></div></div>
      <div class="asec"><div class="asec-hdr"><div class="asec-title">Thursday Tasks</div><button class="addbtn" onclick="openModal('task','thu',null)">+ Add</button></div><div id="adm-thu"></div></div>
      <div class="asec"><div class="asec-hdr"><div class="asec-title">Team Members</div><button class="addbtn" onclick="openModal('member',null,null)">+ Add</button></div><div id="adm-members"></div></div>
      <div class="asec"><div class="asec-hdr"><div class="asec-title">Ski Names</div><button class="addbtn" onclick="saveSkiNames()">Save</button></div><div class="sgrid" id="adm-skinames"></div></div>
      <div class="asec">
        <div class="asec-title" style="margin-bottom:10px">Settings</div>
        <button class="abtn" onclick="openModal('pin',null,null)">🔑 Change PIN</button>
        <button class="abtn" onclick="manualSync()">🔄 Force Sync</button>
        <button class="abtn" onclick="pushAll()">⬆️ Push All Data to Sheet</button>
        <a class="abtn" href="https://docs.google.com/spreadsheets/d/1lM75upNKgGPOhTDkB_FxGhDBrJQX-fwRfblPQD86AM0" target="_blank">📊 Open Google Sheet</a>
      </div>
      <button class="alogout" onclick="adminLogout()">🔒 Lock Admin</button>

<script>

var PAGES = ['daily','mon','tue','wed','thu','maint','history','admin'];

var WDAYS = ['mon','tue','wed','thu'];
var WDAY_NAMES = {mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday'};
var DMAP = {1:'mon',2:'tue',3:'wed',4:'thu',5:'fri',6:'sat',0:'sun'};
var SERVICES = ['oil','filter','plugs'];
var SERVICE_NAMES = {oil:'Oil Change',filter:'Filter Change',plugs:'Spark Plugs'};
var FIRST_INTERVAL = 50, REPEAT_INTERVAL = 100;
var _pin = '', _ctx = {};

var APP = {
  tasks:{daily:[],mon:[],tue:[],wed:[],thu:[]},

var DD = [
  {id:'d1',name:'Take out table',note:'Set up the outdoor table at the office area.',freq:'Daily · Morning'},

];
var WT = {
  mon:[{id:'w1',name:'Spray all engines with WD-40/656',note:'Spray engines with corrosion inhibitor.'},{id:'w2',name:'Collect updated engine hours',note:'Read hour meter on each ski and log readings.',engineHours:true}],
  tue:[{id:'w3',name:'Deep clean — hulls & seats',note:'Scrub hulls with marine cleaner. Clean seats.'},{id:'w4',name:'Restock first aid & safety kit',note:'Check first aid kit and safety equipment.'}],
  wed:[{id:'w5',name:'Battery voltage check',note:'Test battery on all units. 12.6V+ at rest.'},{id:'w6',name:'Life jacket full audit',note:'Inspect all jackets for tears or broken buckles.'},{id:'w7',name:'Delete photos from iPhones',note:'Clear camera rolls after confirming backup.'},{id:'w8',name:'Clean office and wash floors',note:'Full office clean including mopping.'}],
  thu:[{id:'w9',name:'Full engine oil check',note:'Check oil level on each unit. Top off if needed.'},{id:'w10',name:'Check throttle & steering cables',note:'Test full range of motion on handlebars.'},{id:'w11',name:'Inspect impeller & jet pump',note:'Check for debris in intake grate.'},{id:'w12',name:'Power wash jet ski docks/floats',note:'Power wash floating docks. Remove algae.'},{id:'w13',name:'Charge marine radios at EOD',note:'Plug in all marine radios to charge overnight.'},{id:'w14',name:'Check contents of guide bags',note:'Verify guide bags have all required supplies.'}]
};
var DM = ['Ruth','Curtis','Zach','Adam'];
var DSN = []; for(var i=1;i<=25;i++) DSN.push('Ski '+i);

// ── STORAGE ───────────────────────────────────────────────────────────────────
function ls(k,v){if(v===undefined){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}else localStorage.setItem(k,JSON.stringify(v));}
function saveLocal(){ls('jso4',APP);}
function loadLocal(){
  var d=ls('jso4');
  if(d){
    APP.tasks=d.tasks||{};
    APP.members=d.members&&d.members.length?d.members:DM;
    APP.skiNames=d.skiNames&&d.skiNames.length?d.skiNames:DSN;
    APP.pin=d.pin||'1234';
    APP.completions=d.completions||{};
    APP.history=d.history||[];
    APP.skiHours=d.skiHours||{};
    APP.maintLog=d.maintLog||{};
    TASK_PAGES.forEach(function(p){if(!APP.tasks[p]||!APP.tasks[p].length)APP.tasks[p]=p==='daily'?DD:(WT[p]||[]);});
  } else {
    APP.tasks={daily:DD,mon:WT.mon,tue:WT.tue,wed:WT.wed,thu:WT.thu};
    APP.members=DM; APP.skiNames=DSN;
  }
}
function todayKey(){return new Date().toISOString().slice(0,10);}
function weekKey(){var d=new Date(),j=new Date(d.getFullYear(),0,1);return d.getFullYear()+'-W'+Math.ceil(((d-j)/86400000+j.getDay()+1)/7);}
function todayPageKey(){return DMAP[new Date().getDay()];}
function subKey(page){return page==='daily'?todayKey():weekKey()+':'+page;}
function ck(page,id){return page+':'+subKey(page)+':'+id;}

// ── APPS SCRIPT API ───────────────────────────────────────────────────────────
function gasUrl(params){
  var url=GAS_URL+'?';
  var parts=[];
  for(var k in params) parts.push(encodeURIComponent(k)+'='+encodeURIComponent(typeof params[k]==='object'?JSON.stringify(params[k]):params[k]));
  return url+parts.join('&');
}
async function gasRead(tab){
  var r=await fetch(gasUrl({action:'read',tab:tab}));
  var d=await r.json();
  if(d.error) throw new Error(d.error);
  return d.values||[];
}
async function gasWrite(tab,data){
  var r=await fetch(gasUrl({action:'write',tab:tab,data:JSON.stringify(data)}));
  var d=await r.json();
  if(d.error) throw new Error(d.error);
}
async function gasAppend(tab,row){
  var r=await fetch(gasUrl({action:'append',tab:tab,row:JSON.stringify(row)}));
  var d=await r.json();
  if(d.error) throw new Error(d.error);
}

// ── SYNC ──────────────────────────────────────────────────────────────────────
function setSyn(state,lbl){document.getElementById('sdot').className='sdot '+(state||'');document.getElementById('slbl').textContent=lbl;}

async function initSync(){
  setSyn('spin','Connecting…');
  try{
    await pullFromSheet();
    setSyn('ok','Synced');
    renderAll(); highlightToday();
    toast('Connected ✓');
  }catch(e){
    console.error('initSync',e);
    setSyn('err','Offline — local data');
    renderAll(); highlightToday();
  }
}

async function pullFromSheet(){
  var parseTask=function(r){return {id:r[0],name:r[1]||'',note:r[2]||'',freq:r[3]||'',engineHours:r[4]==='true',videoUrl:r[5]||'',photoUrl:r[6]||''};};
  try{
    var dt=await gasRead('Daily Tasks');
    if(dt.length>1) APP.tasks.daily=dt.slice(1).filter(function(r){return r[0];}).map(parseTask);
    var dayMap={mon:'Mon Tasks',tue:'Tue Tasks',wed:'Wed Tasks',thu:'Thu Tasks'};
    for(var day in dayMap){
      var rows=await gasRead(dayMap[day]);
      if(rows.length>1) APP.tasks[day]=rows.slice(1).filter(function(r){return r[0];}).map(parseTask);
    }
    var mb=await gasRead('Members');
    if(mb.length>1) APP.members=mb.slice(1).map(function(r){return r[0];}).filter(Boolean);
    var sn=await gasRead('Ski Names');
    if(sn.length>1) APP.skiNames=sn.slice(1).map(function(r){return r[1]||r[0]||'';});
    var cfg=await gasRead('Config');
    if(cfg.length){var m={};cfg.forEach(function(r){if(r[0])m[r[0]]=r[1];});if(m.pin)APP.pin=m.pin;}
    var today=todayKey(),wk=weekKey();
    var co=await gasRead('Completions');
    APP.completions={};
    if(co.length>1) co.slice(1).forEach(function(r){if(r[0]&&(r[0].indexOf(today)!==-1||r[0].indexOf(wk)!==-1))APP.completions[r[0]]={who:r[1],time:r[2],hj:r[3]||''};});
    var ht=await gasRead('History');
    if(ht.length>1) APP.history=ht.slice(1).slice(0,200).map(function(r){return {date:r[0],time:r[1],taskId:r[2],taskName:r[3],who:r[4],type:r[5]||''};});
    var sh=await gasRead('Ski Hours');
    APP.skiHours={};
    if(sh.length>1) sh.slice(1).forEach(function(r){if(r[0]!==undefined&&r[0]!=='')APP.skiHours[parseInt(r[0])]=parseFloat(r[1])||0;});
    var ml=await gasRead('Maint Log');
    APP.maintLog={};
    if(ml.length>1) ml.slice(1).forEach(function(r){
      var idx=parseInt(r[0]);var svc=r[1];
      if(isNaN(idx)||!svc)return;
      if(!APP.maintLog[idx])APP.maintLog[idx]={oil:[],filter:[],plugs:[]};
      if(!APP.maintLog[idx][svc])APP.maintLog[idx][svc]=[];
      APP.maintLog[idx][svc].push({date:r[2],hours:parseFloat(r[3])||0,who:r[4]||''});
    });
    saveLocal();
    // push defaults if empty
    var isEmpty=dt.length<=1&&mb.length<=1;
    if(isEmpty) await pushAll();
  }catch(e){throw e;}
}

async function pushAll(){
  setSyn('spin','Saving…');
  try{
    var enc=function(t){return [t.id,t.name,t.note||'',t.freq||'',t.engineHours?'true':'false',t.videoUrl||'',t.photoUrl||''];};
    var hdr=['id','name','note','freq','engineHours','videoUrl','photoUrl'];
    await gasWrite('Daily Tasks',[hdr].concat(APP.tasks.daily.map(enc)));
    await gasWrite('Mon Tasks',[hdr].concat(APP.tasks.mon.map(enc)));
    await gasWrite('Tue Tasks',[hdr].concat(APP.tasks.tue.map(enc)));
    await gasWrite('Wed Tasks',[hdr].concat(APP.tasks.wed.map(enc)));
    await gasWrite('Thu Tasks',[hdr].concat(APP.tasks.thu.map(enc)));
    await gasWrite('Members',[['name']].concat(APP.members.map(function(m){return [m];})));
    await gasWrite('Ski Names',[['number','name']].concat(APP.skiNames.map(function(n,i){return [i+1,n];})));
    await gasWrite('Config',[['pin',APP.pin]]);
    var cRows=Object.keys(APP.completions).map(function(k){var v=APP.completions[k];return [k,v.who,v.time,v.hj||''];});
    await gasWrite('Completions',[['key','who','time','hours']].concat(cRows));
    await gasWrite('History',[['date','time','taskId','taskName','who','type']].concat(APP.history.map(function(e){return [e.date,e.time,e.taskId,e.taskName,e.who,e.type||''];})));
    var hRows=Object.keys(APP.skiHours).map(function(k){return [parseInt(k),APP.skiHours[k]];});
    await gasWrite('Ski Hours',[['skiIdx','hours']].concat(hRows));
    var mRows=[];
    Object.keys(APP.maintLog).forEach(function(idx){var skiLog=APP.maintLog[idx];SERVICES.forEach(function(svc){(skiLog[svc]||[]).forEach(function(e){mRows.push([parseInt(idx),svc,e.date,e.hours,e.who]);});});});
    await gasWrite('Maint Log',[['skiIdx','service','date','hours','who']].concat(mRows));
    setSyn('ok','Synced');
    toast('All data saved ✓');
  }catch(e){console.error(e);setSyn('err','Save failed');}
}

async function manualSync(){
  setSyn('spin','Syncing…');
  try{await pullFromSheet();setSyn('ok','Synced');renderAll();toast('Synced ✓');}
  catch(e){setSyn('err','Sync failed');}
}

// ── SIGN OFF ──────────────────────────────────────────────────────────────────
async function doSignOff(page,taskId,taskName,who,hj){
  var time=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  var key=ck(page,taskId);
  APP.completions[key]={who:who,time:time,hj:hj||''};
  var entry={date:todayKey(),time:time,taskId:taskId,taskName:taskName,who:who,type:page==='daily'?'daily':'weekly'};
  APP.history.unshift(entry);
  if(APP.history.length>500) APP.history=APP.history.slice(0,500);
  saveLocal();renderPage(page);renderHistory();
  setSyn('spin','Saving…');
  try{
    await gasAppend('Completions',[key,who,time,hj||'']);
    await gasAppend('History',[entry.date,entry.time,entry.taskId,entry.taskName,entry.who,entry.type]);
    setSyn('ok','Synced');
  }catch(e){setSyn('err','Save failed');}
}

async function undoTask(page,taskId){
  delete APP.completions[ck(page,taskId)];
  saveLocal();renderPage(page);renderHistory();
  setSyn('spin','Saving…');
  try{
    var cRows=Object.keys(APP.completions).map(function(k){var v=APP.completions[k];return [k,v.who,v.time,v.hj||''];});
    await gasWrite('Completions',[['key','who','time','hours']].concat(cRows));
    setSyn('ok','Synced');
  }catch(e){setSyn('err','Save failed');}
}

// ── CO BAR ────────────────────────────────────────────────────────────────────
function coKey(page){return 'co:'+page+':'+subKey(page);}
function renderCOBar(page){
  var key=coKey(page);var saved=APP.completions[key]?APP.completions[key].who:'';
  var opts=APP.members.map(function(m){return '<option value="'+m+'"'+(saved===m?' selected':'')+'>'+m+'</option>';}).join('');
  return '<div class="co-bar"><div class="co-lbl">Conning Officer</div><select class="co-sel" id="co-'+page+'" onchange="saveCO(\''+page+'\')"><option value="">— Select —</option>'+opts+'</select></div>';
}
async function saveCO(page){
  var sel=document.getElementById('co-'+page);if(!sel||!sel.value)return;
  var key=coKey(page);var time=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  APP.completions[key]={who:sel.value,time:time,hj:''};saveLocal();
  try{await gasAppend('Completions',[key,sel.value,time,'']);}catch(e){}
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function fcomps(page){
  var px=page+':'+subKey(page)+':',out={};
  Object.keys(APP.completions).forEach(function(k){if(k.indexOf(px)===0)out[k.split(':').pop()]=APP.completions[k];});
  return out;
}

function renderPage(page){
  if(page==='history'){renderHistory();return;}
  if(page==='admin')return;
  if(page==='maint'){renderMaint();return;}
  var tasks=APP.tasks[page]||[];var comps=fcomps(page);var done=Object.keys(comps).length;
  document.getElementById('pbar-'+page).style.width=(tasks.length?Math.round(done/tasks.length*100):0)+'%';
  var html=renderCOBar(page);
  if(page==='daily'){
    var secs=[{t:'Morning Tasks',f:'Morning'},{t:'Evening Tasks',f:'Evening'}];
    secs.forEach(function(s){
      var list=tasks.filter(function(t){return t.freq&&t.freq.indexOf(s.f)!==-1;});
      if(!list.length)return;
      var sd=list.filter(function(t){return comps[t.id];}).length;
      html+='<div class="sec"><div class="sec-hdr"><span class="sec-title">'+s.t+'</span><span class="sec-prog">'+sd+'/'+list.length+'</span></div>';
      list.forEach(function(t){html+=cardHTML(t,page,comps[t.id]);});
      html+='</div>';
    });
  } else {
    if(!tasks.length){html+='<div class="empty">No tasks for '+WDAY_NAMES[page]+'.</div>';}
    else{html+='<div class="sec">';tasks.forEach(function(t){html+=cardHTML(t,page,comps[t.id]);});html+='</div>';}
  }
  document.getElementById('tasks-'+page).innerHTML=html;
}

function getYouTubeId(url){
  if(!url)return null;
  var m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);
  return m?m[1]:null;
}
function getDriveId(url){
  if(!url)return null;
  var m=url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  return m?m[1]:null;
}

function cardHTML(task,page,comp){
  var isDone=!!comp;
  var sn=task.name.replace(/'/g,"\\'").replace(/"/g,'&quot;');
  var nbtns=APP.members.map(function(n){return '<button class="nbtn" onclick="selName(\''+page+'\',\''+task.id+'\',\''+sn+'\',\''+n+'\',this)">'+n+'</button>';}).join('');
  var hgrid=task.engineHours?buildHGrid(task.id,isDone,comp):'';
  var meta=isDone?'✓ '+comp.who+' · '+comp.time:(task.freq||WDAY_NAMES[page]||'');

  // Media
  var mediaHtml='';
  var ytId=getYouTubeId(task.videoUrl||'');
  var driveId=getDriveId(task.photoUrl||'');
  if(ytId) mediaHtml+='<iframe class="task-video" src="https://www.youtube.com/embed/'+ytId+'" allowfullscreen></iframe>';
  if(driveId) mediaHtml+='<img class="task-photo" src="https://drive.google.com/thumbnail?id='+driveId+'&sz=w800" alt="Task reference" onerror="this.style.display=\'none\'">';

  return '<div class="card'+(isDone?' done':'')+'" id="card-'+task.id+'">'+
    '<div class="card-row" onclick="tog(\''+task.id+'\')"><div class="chk">'+(isDone?'✓':'')+(task.videoUrl||task.photoUrl?'<span style="position:absolute;font-size:8px;margin-top:16px;margin-left:-6px">'+(task.videoUrl?'▶':'')+(task.photoUrl?'📷':'')+'</span>':'')+'</div>'+
    '<div class="ci"><div class="cn">'+task.name+'</div><div class="cm">'+meta+(task.videoUrl?' · 📹':'')+(task.photoUrl?' · 📷':'')+'</div></div>'+
    '<div class="caret">⌄</div></div>'+
    '<div class="detail" id="det-'+task.id+'">'+
    (task.note?'<div class="dnote">'+task.note+'</div>':'')+
    mediaHtml+hgrid+
    '<div class="slbl">Sign Off</div>'+
    (isDone?'<div class="dby">✅ '+comp.who+' · '+comp.time+'</div><button class="undobtn" onclick="undoTask(\''+page+'\',\''+task.id+'\')">Undo Sign-Off</button>'
    :'<div class="npicker" id="np-'+task.id+'">'+nbtns+'</div><button class="cfmbtn" id="cfm-'+task.id+'"></button>')+'</div></div>';
}

function buildHGrid(tid,isDone,comp){
  var hours={};if(isDone&&comp&&comp.hj){try{hours=JSON.parse(comp.hj);}catch(e){}}
  var h='<div class="hgrid">';
  for(var i=1;i<=25;i++){h+='<div class="hbox"><div class="hlbl">'+(APP.skiNames[i-1]||'Ski '+i)+'</div><input class="hinp" id="hr-'+tid+'-'+i+'" type="number" inputmode="decimal" placeholder="—" value="'+(hours[i]||'')+'"'+(isDone?' disabled':'')+'/></div>';}
  return h+'</div>';
}
function getHours(tid){var h={};for(var i=1;i<=25;i++){var el=document.getElementById('hr-'+tid+'-'+i);if(el&&el.value)h[i]=el.value;}return Object.keys(h).length?JSON.stringify(h):'';}
function tog(id){document.getElementById('card-'+id).classList.toggle('open');}
function selName(page,tid,taskName,name,btn){
  var np=document.getElementById('np-'+tid);np.querySelectorAll('.nbtn').forEach(function(b){b.classList.remove('sel');});btn.classList.add('sel');
  var cb=document.getElementById('cfm-'+tid);cb.className='cfmbtn show';cb.textContent='✓ Sign off as '+name;
  var allTasks=[];TASK_PAGES.forEach(function(p){if(APP.tasks[p])allTasks=allTasks.concat(APP.tasks[p]);});
  var task=allTasks.filter(function(t){return t.id===tid;})[0];
  cb.onclick=function(){doSignOff(page,tid,taskName,name,task&&task.engineHours?getHours(tid):'');};
}

// ── MAINTENANCE ───────────────────────────────────────────────────────────────
function nextDue(log){if(!log||!log.length)return FIRST_INTERVAL;return log[log.length-1].hours+REPEAT_INTERVAL;}
function skiStatus(idx){
  var hrs=parseFloat(APP.skiHours[idx]||0),worst='ok';
  SERVICES.forEach(function(svc){var log=(APP.maintLog[idx]&&APP.maintLog[idx][svc])||[];var diff=nextDue(log)-hrs;if(diff<=0)worst='overdue';else if(diff<=10&&worst==='ok')worst='due-soon';});
  return worst;
}
function renderMaint(){
  var html='<div style="margin-bottom:12px"><div style="font-family:\'Barlow Condensed\',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gray)">Fleet · 25 Units</div></div>';
  for(var i=0;i<25;i++){
    var name=APP.skiNames[i]||('Ski '+(i+1));
    var hrs=parseFloat(APP.skiHours[i]||0);
    var status=skiStatus(i);
    var pills='';
    (function(idx){
      SERVICES.forEach(function(svc){
        var log=(APP.maintLog[idx]&&APP.maintLog[idx][svc])||[];
        var due=nextDue(log),diff=due-hrs;
        var cls=diff<=0?'overdue':diff<=10?'due-soon':'ok';
        var label=diff<=0?SERVICE_NAMES[svc]+' OVERDUE':diff<=10?SERVICE_NAMES[svc]+' due in '+Math.round(diff)+'h':SERVICE_NAMES[svc]+' ✓';
        pills+='<span class="pill '+cls+'">'+label+'</span>';
      });
    })(i);
    html+='<div class="maint-ski-card '+status+'" id="mcard-'+i+'">'+
      '<div class="maint-ski-row" onclick="togMaint('+i+')">'+
      '<div class="maint-ski-num">'+(i+1)+'</div>'+
      '<div class="maint-ski-info"><div class="maint-ski-name">'+name+'</div><div class="maint-ski-hrs">'+hrs+' hrs</div></div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:4px;flex:1;justify-content:flex-end;padding-right:8px">'+pills+'</div>'+
      '<div class="caret" style="font-size:18px;color:var(--gray);flex-shrink:0">⌄</div></div>'+
      '<div class="maint-detail" id="mdet-'+i+'">'+
      '<div class="maint-hrs-bar"><div class="maint-hrs-lbl">Current Hrs</div>'+
      '<input class="maint-hrs-inp" id="mhrs-'+i+'" type="number" inputmode="decimal" value="'+hrs+'" placeholder="0">'+
      '<button class="maint-hrs-save" onclick="saveHours('+i+')">Update</button></div>'+
      renderServiceRows(i,hrs)+'</div></div>';
  }
  document.getElementById('maint-content').innerHTML=html;
}

function renderServiceRows(idx,hrs){
  var html='';
  SERVICES.forEach(function(svc){
    var log=(APP.maintLog[idx]&&APP.maintLog[idx][svc])||[];
    var due=nextDue(log),diff=due-hrs;
    var cls=diff<=0?'overdue':diff<=10?'due-soon':'ok';
    var dueText=diff<=0?'⚠️ Overdue by '+Math.abs(Math.round(diff))+'h':'Due at '+due+'h ('+Math.round(diff)+'h remaining)';
    var lastText=log.length?'Last: '+log[log.length-1].date+' @ '+log[log.length-1].hours+'h by '+log[log.length-1].who:'Never serviced';
    html+='<div class="service-row"><div><div class="service-name">'+SERVICE_NAMES[svc]+'</div><div class="service-info">'+lastText+'</div><div class="service-due '+cls+'">'+dueText+'</div></div>'+
      '<button class="log-service-btn" onclick="openModal(\'service\','+idx+',\''+svc+'\')">Log</button></div>';
    if(log.length){
      html+='<div class="service-history"><div class="service-history-title">History</div>';
      log.slice().reverse().slice(0,5).forEach(function(e){html+='<div class="service-history-row"><span>'+e.date+'</span><span>'+e.hours+'h · '+e.who+'</span></div>';});
      html+='</div>';
    }
  });
  return html;
}

function togMaint(i){document.getElementById('mcard-'+i).classList.toggle('open');}

async function saveHours(idx){
  var el=document.getElementById('mhrs-'+idx);if(!el)return;
  var val=parseFloat(el.value);if(isNaN(val))return;
  APP.skiHours[idx]=val;saveLocal();renderMaint();toast('Hours updated');
  setSyn('spin','Saving…');
  try{
    var hRows=Object.keys(APP.skiHours).map(function(k){return [parseInt(k),APP.skiHours[k]];});
    await gasWrite('Ski Hours',[['skiIdx','hours']].concat(hRows));
    setSyn('ok','Synced');
  }catch(e){setSyn('err','Save failed');}
}

// ── HISTORY ───────────────────────────────────────────────────────────────────
function renderHistory(){
  var log=APP.history,el=document.getElementById('hist-log');
  if(!log.length){el.innerHTML='<div class="empty">No completed tasks yet.</div>';return;}
  var byDate={};log.forEach(function(e){(byDate[e.date]=byDate[e.date]||[]).push(e);});
  var html='';
  Object.keys(byDate).forEach(function(date){
    var entries=byDate[date];var d=new Date(date+'T12:00:00');
    html+='<div class="hday"><div class="hday-hdr">'+d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})+'</div>';
    entries.forEach(function(e){html+='<div class="hentry"><div class="hdot'+(e.type==='weekly'?' w':'')+'"></div><div class="ci"><div class="htask">'+e.taskName+'</div><div class="hwho">'+e.who+'</div></div><div class="htime">'+e.time+'</div></div>';});
    html+='</div>';
  });
  el.innerHTML=html;
}

// ── ADMIN ─────────────────────────────────────────────────────────────────────
function renderAdmin(){
  var pages=['daily','mon','tue','wed','thu'];
  var labels={daily:'Daily',mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday'};
  pages.forEach(function(page){
    var el=document.getElementById('adm-'+page);if(!el)return;
    el.innerHTML=(APP.tasks[page]||[]).map(function(t){
      var icons=(t.videoUrl?'📹 ':'' )+(t.photoUrl?'📷 ':'');
      return '<div class="acard"><div class="acard-info"><div class="acard-name">'+icons+t.name+'</div><div class="acard-meta">'+(t.freq||labels[page])+'</div></div>'+
        '<div class="acard-acts"><button class="aact ea" onclick="openModal(\'task\',\''+page+'\',\''+t.id+'\')">Edit</button>'+
        '<button class="aact da" onclick="delTask(\''+page+'\',\''+t.id+'\')">Del</button></div></div>';
    }).join('');
  });
  document.getElementById('adm-members').innerHTML='<div class="chips">'+APP.members.map(function(m,i){return '<div class="chip">'+m+'<button class="chipdel" onclick="delMember('+i+')">×</button></div>';}).join('')+'</div>';
  document.getElementById('adm-skinames').innerHTML=APP.skiNames.map(function(n,i){return '<div class="srow"><span class="snum">'+(i+1)+'</span><input class="sinp" id="sn-'+i+'" value="'+n+'" placeholder="Ski '+(i+1)+'"></div>';}).join('');
}

async function saveSkiNames(){
  APP.skiNames=APP.skiNames.map(function(_,i){return (document.getElementById('sn-'+i)||{}).value||'Ski '+(i+1);});
  saveLocal();toast('Ski names saved');
  setSyn('spin','Saving…');
  try{await gasWrite('Ski Names',[['number','name']].concat(APP.skiNames.map(function(n,i){return [i+1,n];})));setSyn('ok','Synced');}
  catch(e){setSyn('err','Save failed');}
}
async function delTask(page,id){
  if(!confirm('Delete this task?'))return;
  APP.tasks[page]=APP.tasks[page].filter(function(t){return t.id!==id;});
  saveLocal();renderAdmin();renderPage(page);
  setSyn('spin','Saving…');
  try{
    var enc=function(t){return [t.id,t.name,t.note||'',t.freq||'',t.engineHours?'true':'false',t.videoUrl||'',t.photoUrl||''];};
    var tabMap={daily:'Daily Tasks',mon:'Mon Tasks',tue:'Tue Tasks',wed:'Wed Tasks',thu:'Thu Tasks'};
    await gasWrite(tabMap[page],[['id','name','note','freq','engineHours','videoUrl','photoUrl']].concat(APP.tasks[page].map(enc)));
    setSyn('ok','Synced');
  }catch(e){setSyn('err','Save failed');}
}
async function delMember(idx){
  if(APP.members.length<=1){alert('Must keep at least one member.');return;}
  APP.members.splice(idx,1);saveLocal();renderAdmin();
  setSyn('spin','Saving…');
  try{await gasWrite('Members',[['name']].concat(APP.members.map(function(m){return [m];})));setSyn('ok','Synced');}
  catch(e){setSyn('err','Save failed');}
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
function openModal(type,subtype,id){
  _ctx={type:type,subtype:subtype,id:id};
  var body=document.getElementById('mbody');
  var pageLabels={daily:'Daily',mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday'};
  if(type==='service'){
    var idx=subtype,svc=id,hrs=APP.skiHours[idx]||0;
    document.getElementById('mtitle').textContent='Log '+SERVICE_NAMES[svc]+' — '+(APP.skiNames[idx]||'Ski '+(idx+1));
    body.innerHTML='<div class="flbl">Hours at Service</div><input class="finp" id="msvc-hrs" type="number" inputmode="decimal" value="'+hrs+'" placeholder="Current hours">'+
      '<div class="flbl">Performed By</div><select class="fsel" id="msvc-who"><option value="">— Select —</option>'+APP.members.map(function(m){return '<option value="'+m+'">'+m+'</option>';}).join('')+'</select>';
  } else if(type==='task'){
    var tasks=APP.tasks[subtype]||[];var task=id?tasks.filter(function(t){return t.id===id;})[0]:null;
    var freqField=subtype==='daily'?'<div class="flbl">Schedule</div><select class="fsel" id="mfreq"><option value="Daily · Morning"'+(task&&task.freq==='Daily · Morning'?' selected':'')+'>Daily · Morning</option><option value="Daily · Evening"'+(task&&task.freq==='Daily · Evening'?' selected':'')+'>Daily · Evening</option></select>':'';
    var ehField=subtype!=='daily'?'<div class="flbl">Engine Hours Task?</div><select class="fsel" id="meh"><option value="false"'+(task&&!task.engineHours?' selected':'')+'>No</option><option value="true"'+(task&&task.engineHours?' selected':'')+'>Yes — 25-ski grid</option></select>':'';
    document.getElementById('mtitle').textContent=(id?'Edit':'Add')+' '+(pageLabels[subtype]||subtype)+' Task';
    body.innerHTML='<div class="flbl">Task Name</div><input class="finp" id="mn" value="'+(task?task.name:'')+'" placeholder="Task name">'+
      '<div class="flbl">Notes</div><textarea class="finp" id="mnote" placeholder="Instructions…">'+(task?task.note:'')+'</textarea>'+
      freqField+ehField+
      '<div class="flbl">📹 YouTube Video URL (optional)</div><input class="finp" id="mvidurl" value="'+(task&&task.videoUrl?task.videoUrl:'')+'" placeholder="https://youtube.com/watch?v=...">'+
      '<div class="flbl">📷 Google Drive Photo URL (optional)</div><input class="finp" id="mphotourl" value="'+(task&&task.photoUrl?task.photoUrl:'')+'" placeholder="https://drive.google.com/file/d/...">';
  } else if(type==='member'){
    document.getElementById('mtitle').textContent='Add Team Member';
    body.innerHTML='<div class="flbl">Name</div><input class="finp" id="mm" placeholder="e.g. Marcus" autocorrect="off">';
  } else {
    document.getElementById('mtitle').textContent='Change PIN';
    body.innerHTML='<div class="flbl">New PIN (4 digits)</div><input class="finp" id="mp1" type="tel" maxlength="4" placeholder="e.g. 5678" inputmode="numeric"><div class="flbl">Confirm PIN</div><input class="finp" id="mp2" type="tel" maxlength="4" placeholder="Repeat PIN" inputmode="numeric">';
  }
  document.getElementById('moverlay').classList.add('open');
  setTimeout(function(){var f=body.querySelector('input,textarea,select');if(f)f.focus();},150);
}
function closeModal(){document.getElementById('moverlay').classList.remove('open');_ctx={};}

async function modalSave(){
  var type=_ctx.type,subtype=_ctx.subtype,id=_ctx.id;
  if(type==='service'){
    var idx=subtype,svc=id;
    var hrs=parseFloat((document.getElementById('msvc-hrs')||{}).value);
    var who=(document.getElementById('msvc-who')||{}).value;
    if(isNaN(hrs)||!who){toast('Fill in all fields');return;}
    if(!APP.maintLog[idx])APP.maintLog[idx]={oil:[],filter:[],plugs:[]};
    if(!APP.maintLog[idx][svc])APP.maintLog[idx][svc]=[];
    var entry={date:todayKey(),hours:hrs,who:who};
    APP.maintLog[idx][svc].push(entry);
    APP.skiHours[idx]=hrs;
    saveLocal();closeModal();renderMaint();
    setSyn('spin','Saving…');
    try{
      await gasAppend('Maint Log',[idx,svc,entry.date,hrs,who]);
      var hRows=Object.keys(APP.skiHours).map(function(k){return [parseInt(k),APP.skiHours[k]];});
      await gasWrite('Ski Hours',[['skiIdx','hours']].concat(hRows));
      setSyn('ok','Synced');toast(SERVICE_NAMES[svc]+' logged ✓');
    }catch(e){setSyn('err','Save failed');}
  } else if(type==='task'){
    var name=(document.getElementById('mn')||{}).value.trim();
    var note=(document.getElementById('mnote')||{}).value.trim();
    var videoUrl=(document.getElementById('mvidurl')||{}).value.trim();
    var photoUrl=(document.getElementById('mphotourl')||{}).value.trim();
    if(!name){document.getElementById('mn').style.borderColor='var(--red)';return;}
    var freq=subtype==='daily'?document.getElementById('mfreq').value:'';
    var eh=subtype!=='daily'&&document.getElementById('meh')?document.getElementById('meh').value==='true':false;
    if(id){
      var t=APP.tasks[subtype].filter(function(t){return t.id===id;})[0];
      t.name=name;t.note=note;if(freq)t.freq=freq;t.engineHours=eh;t.videoUrl=videoUrl;t.photoUrl=photoUrl;
    } else {
      APP.tasks[subtype].push({id:subtype[0]+Date.now().toString(36),name:name,note:note,freq:freq,engineHours:eh,videoUrl:videoUrl,photoUrl:photoUrl});
    }
    closeModal();saveLocal();renderAdmin();renderPage(subtype);
    setSyn('spin','Saving…');
    try{
      var enc=function(t){return [t.id,t.name,t.note||'',t.freq||'',t.engineHours?'true':'false',t.videoUrl||'',t.photoUrl||''];};
      var tabMap={daily:'Daily Tasks',mon:'Mon Tasks',tue:'Tue Tasks',wed:'Wed Tasks',thu:'Thu Tasks'};
      await gasWrite(tabMap[subtype],[['id','name','note','freq','engineHours','videoUrl','photoUrl']].concat(APP.tasks[subtype].map(enc)));
      setSyn('ok','Synced');
    }catch(e){setSyn('err','Save failed');}
  } else if(type==='member'){
    var nm=(document.getElementById('mm')||{}).value.trim();
    if(!nm){document.getElementById('mm').style.borderColor='var(--red)';return;}
    if(APP.members.indexOf(nm)===-1)APP.members.push(nm);
    closeModal();saveLocal();renderAdmin();
    setSyn('spin','Saving…');
    try{await gasWrite('Members',[['name']].concat(APP.members.map(function(m){return [m];})));setSyn('ok','Synced');}
    catch(e){setSyn('err','Save failed');}
  } else {
    var p1=document.getElementById('mp1').value.trim(),p2=document.getElementById('mp2').value.trim();
    if(!/^\d{4}$/.test(p1)){alert('PIN must be 4 digits.');return;}
    if(p1!==p2){alert('PINs do not match.');return;}
    APP.pin=p1;closeModal();saveLocal();toast('PIN updated');
    setSyn('spin','Saving…');
    try{await gasWrite('Config',[['pin',APP.pin]]);setSyn('ok','Synced');}
    catch(e){setSyn('err','Save failed');}
  }
}

// ── PIN ───────────────────────────────────────────────────────────────────────
function pp(d){if(_pin.length>=4)return;_pin+=d;updDots();if(_pin.length===4)setTimeout(chkPin,120);}
function pd(){_pin=_pin.slice(0,-1);updDots();}
function updDots(state){var dots=document.querySelectorAll('.pdot');for(var i=0;i<dots.length;i++){dots[i].classList.toggle('f',i<_pin.length);dots[i].classList.toggle('e',state==='err');}}
function chkPin(){
  if(_pin===APP.pin){_pin='';updDots();document.getElementById('pin-gate').style.display='none';document.getElementById('adm-content').style.display='block';renderAdmin();document.getElementById('perr').textContent='';}
  else{updDots('err');document.getElementById('perr').textContent='Incorrect PIN.';setTimeout(function(){_pin='';updDots();document.getElementById('perr').textContent='';},1000);}
}
function adminLogout(){_pin='';updDots();document.getElementById('adm-content').style.display='none';document.getElementById('pin-gate').style.display='block';}

// ── NAV ───────────────────────────────────────────────────────────────────────
function showPage(page){
  PAGES.forEach(function(p){
    document.getElementById('page-'+p).classList.toggle('active',p===page);
    var tab=document.getElementById('tab-'+p);if(tab)tab.classList.toggle('active',p===page);
    var nav=document.getElementById('nav-'+p);if(nav)nav.classList.toggle('active',p===page);
  });
  renderPage(page);
}
function highlightToday(){
  var today=todayPageKey();
  WDAYS.forEach(function(d){
    var tb=document.getElementById('tab-'+d);if(tb)tb.style.background=d===today?'rgba(72,202,228,.25)':'';
    var nb=document.getElementById('nav-'+d);if(nb){nb.classList.toggle('today-day',d===today);if(d===today)nb.querySelector('.nlbl').style.color=nb.classList.contains('active')?'var(--ocean)':'var(--sky)';}
  });
}
function renderAll(){PAGES.forEach(function(p){if(p!=='admin')renderPage(p);});}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}

// ── INIT ──────────────────────────────────────────────────────────────────────
loadLocal();
renderAll();
highlightToday();
initSync();
setInterval(function(){manualSync();},60000);
</script>
</body>
