<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jet Ski Ops · NY</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ocean:#0077b6;--deep:#023e8a;--sky:#48cae4;--foam:#e0f4ff;--green:#2dc653;--red:#e63946;--gray:#8d99ae;--dark:#0d1b2a;--border:#e2ecf5;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Barlow',sans-serif;background:#f0f7ff;color:var(--dark);min-height:100vh;padding-bottom:calc(80px + var(--sb));}
.hdr{background:linear-gradient(135deg,var(--deep),var(--ocean));padding:calc(var(--st)+16px) 20px 20px;position:sticky;top:0;z-index:100;}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.brand{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;color:#fff;}
.brand-sub{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;letter-spacing:2px;color:var(--sky);text-transform:uppercase;display:block;margin-top:-2px;}
.sbadge{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:5px 12px;font-size:11px;font-weight:600;color:#fff;display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap;}
.sdot{width:7px;height:7px;border-radius:50%;background:#aaa;flex-shrink:0;}
.sdot.ok{background:var(--green);}.sdot.err{background:var(--red);}.sdot.spin{background:var(--sky);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.tabs{display:flex;background:rgba(255,255,255,.1);border-radius:10px;padding:3px;gap:3px;}
.tab{flex:1;padding:8px 0;border:none;border-radius:8px;background:transparent;color:rgba(255,255,255,.6);font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;text-transform:uppercase;cursor:pointer;}
.tab.active{background:#fff;color:var(--deep);}
.content{padding:16px 16px 0;}
.page{display:none;}.page.active{display:block;}
.pbar-wrap{background:#dceeff;border-radius:20px;height:6px;margin-bottom:16px;overflow:hidden;}
.pbar{height:100%;background:linear-gradient(90deg,var(--sky),var(--ocean));border-radius:20px;transition:width .4s;}
.sec{margin-bottom:20px;}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px;}
.sec-title{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gray);}
.sec-prog{font-size:12px;font-weight:600;color:var(--ocean);}
.card{background:#fff;border-radius:14px;margin-bottom:8px;border:1.5px solid var(--border);overflow:hidden;}
.card.done{border-color:#c8f0d8;background:#f6fef9;}
.card-row{display:flex;align-items:center;padding:14px 16px;gap:14px;cursor:pointer;user-select:none;}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff;font-size:13px;}
.card.done .chk{background:var(--green);border-color:var(--green);color:#fff;}
.ci{flex:1;min-width:0;}
.cn{font-size:15px;font-weight:600;color:var(--dark);margin-bottom:2px;line-height:1.3;}
.card.done .cn{color:#4caf7d;text-decoration:line-through;text-decoration-color:#a8d5bc;}
.cm{font-size:12px;color:var(--gray);font-weight:500;}
.card.done .cm{color:#a8d5bc;}
.caret{font-size:18px;color:var(--gray);transition:transform .2s;flex-shrink:0;}
.card.open .caret{transform:rotate(180deg);}
.detail{display:none;padding:0 16px 14px;border-top:1px solid var(--border);}
.card.open .detail{display:block;}
.dnote{font-size:13px;color:#5a6a7a;line-height:1.5;margin-bottom:12px;padding-top:10px;}
.slbl{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gray);margin-bottom:6px;}
.npicker{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.nbtn{border:2px solid var(--border);background:var(--foam);border-radius:10px;padding:12px 8px;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:var(--dark);cursor:pointer;text-align:center;}
.nbtn.sel{background:var(--ocean);border-color:var(--ocean);color:#fff;}
.cfmbtn{width:100%;background:var(--green);color:#fff;border:none;border-radius:10px;padding:13px;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;cursor:pointer;display:none;}
.cfmbtn.show{display:block;}
.dby{font-size:12px;color:#4caf7d;font-weight:600;margin-top:4px;}
.undobtn{background:var(--gray);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;cursor:pointer;width:100%;margin-top:8px;}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.hbox{background:var(--foam);border:1.5px solid var(--border);border-radius:10px;padding:8px;}
.hlbl{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--gray);text-transform:uppercase;margin-bottom:4px;}
.hinp{width:100%;border:none;background:transparent;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:var(--dark);outline:none;text-align:center;}
.dtabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px;}
.dtab{flex-shrink:0;padding:8px 16px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--gray);cursor:pointer;}
.dtab.active{background:var(--ocean);border-color:var(--ocean);color:#fff;}
.dtab.today{border-color:var(--ocean);color:var(--ocean);}
.dtab.today.active{background:var(--ocean);color:#fff;}
.empty{text-align:center;padding:50px 20px;color:var(--gray);}
.auth-screen{display:flex;flex-direction:column;align-items:center;padding:60px 20px;text-align:center;}
.auth-icon{font-size:56px;margin-bottom:16px;}
.auth-title{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;color:var(--deep);margin-bottom:8px;}
.auth-sub{font-size:14px;color:var(--gray);line-height:1.6;margin-bottom:32px;}
.auth-btn{background:var(--ocean);color:#fff;border:none;border-radius:14px;padding:16px 32px;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;cursor:pointer;width:100%;max-width:280px;}
/* HISTORY */
.hday{margin-bottom:20px;}
.hday-hdr{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gray);margin-bottom:8px;}
.hentry{background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:6px;border:1.5px solid var(--border);display:flex;align-items:center;gap:10px;}
.hdot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;}
.hdot.w{background:var(--ocean);}
.htask{flex:1;font-size:14px;font-weight:600;}
.hwho{font-size:12px;color:var(--gray);}
.htime{font-size:11px;color:var(--gray);flex-shrink:0;}
/* ADMIN */
.pin-screen{display:flex;flex-direction:column;align-items:center;padding:40px 20px;}
.pin-title{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;color:var(--deep);margin-bottom:6px;}
.pin-sub{font-size:14px;color:var(--gray);margin-bottom:32px;text-align:center;}
.pdots{display:flex;gap:14px;margin-bottom:28px;}
.pdot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);background:#fff;}
.pdot.f{background:var(--ocean);border-color:var(--ocean);}
.pdot.e{background:var(--red);border-color:var(--red);}
.ppad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:240px;}
.pkey{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:18px;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;color:var(--dark);cursor:pointer;text-align:center;user-select:none;}
.pkey:active{background:var(--foam);transform:scale(.95);}
.perr{font-size:13px;color:var(--red);font-weight:600;margin-top:16px;min-height:20px;text-align:center;}
.adm{padding-top:4px;}
.asec{margin-bottom:24px;}
.asec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.asec-title{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--deep);}
.addbtn{background:var(--ocean);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
.acard{background:#fff;border-radius:12px;border:1.5px solid var(--border);margin-bottom:8px;padding:12px 14px;display:flex;align-items:flex-start;gap:10px;}
.acard-info{flex:1;min-width:0;}
.acard-name{font-size:14px;font-weight:600;margin-bottom:2px;}
.acard-meta{font-size:12px;color:var(--gray);}
.acard-acts{display:flex;gap:6px;flex-shrink:0;}
.aact{border:none;border-radius:7px;padding:6px 10px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;cursor:pointer;}
.ea{background:var(--foam);color:var(--ocean);border:1.5px solid #b8dcf5;}
.da{background:#fff0f0;color:var(--red);border:1.5px solid #ffd5d5;}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-top:4px;}
.chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--border);border-radius:20px;padding:8px 14px;font-weight:600;font-size:14px;}
.chipdel{background:none;border:none;color:var(--gray);font-size:18px;cursor:pointer;padding:0;line-height:1;}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.srow{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:8px 12px;}
.snum{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--gray);width:24px;flex-shrink:0;}
.sinp{flex:1;border:none;outline:none;font-size:14px;font-weight:600;color:var(--dark);background:transparent;min-width:0;}
.abtn{width:100%;background:#f0f4f8;color:var(--dark);border:1.5px solid var(--border);border-radius:10px;padding:12px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:10px;display:block;text-align:center;text-decoration:none;}
.alogout{width:100%;background:#f0f4f8;color:var(--gray);border:none;border-radius:10px;padding:13px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;}
/* FIELD */
.flbl{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gray);margin-bottom:5px;}
.finp{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:11px 13px;font-family:'Barlow',sans-serif;font-size:15px;color:var(--dark);background:var(--foam);outline:none;margin-bottom:14px;}
.finp:focus{border-color:var(--ocean);background:#fff;}
textarea.finp{resize:none;min-height:70px;}
.fsel{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:11px 13px;font-family:'Barlow',sans-serif;font-size:15px;color:var(--dark);background:var(--foam);outline:none;margin-bottom:14px;-webkit-appearance:none;}
/* MODAL */
.moverlay{display:none;position:fixed;inset:0;background:rgba(2,20,50,.5);z-index:200;align-items:flex-end;justify-content:center;}
.moverlay.open{display:flex;}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:24px 20px calc(24px + var(--sb));width:100%;max-height:90vh;overflow-y:auto;}
.mtitle{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;color:var(--deep);margin-bottom:20px;}
.macts{display:flex;gap:10px;margin-top:4px;}
.msave{flex:1;background:var(--ocean);color:#fff;border:none;border-radius:10px;padding:14px;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;cursor:pointer;}
.mcancel{flex:1;background:#f0f4f8;color:var(--gray);border:none;border-radius:10px;padding:14px;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;cursor:pointer;}
/* NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;padding:10px 0 calc(10px + var(--sb));z-index:100;}
.nbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:transparent;cursor:pointer;padding:4px 0;}
.nicon{font-size:20px;}
.nlbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gray);}
.nbtn.active .nlbl{color:var(--ocean);}
.toast{position:fixed;bottom:calc(90px + var(--sb));left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;border-radius:20px;padding:10px 20px;font-size:13px;font-weight:600;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <div><div class="brand">🌊 JET SKI OPS</div><span class="brand-sub">New York</span></div>
    <div class="sbadge" id="sbadge"><div class="sdot" id="sdot"></div><span id="slbl">Loading…</span></div>
  </div>
  <div class="tabs">
    <button class="tab active" id="tab-daily" onclick="showPage('daily')">Daily</button>
    <button class="tab" id="tab-weekly" onclick="showPage('weekly')">Weekly</button>
    <button class="tab" id="tab-history" onclick="showPage('history')">History</button>
    <button class="tab" id="tab-admin" onclick="showPage('admin')">Admin</button>
  </div>
</div>

<div class="content">
  <div class="page active" id="page-daily">
    <div class="pbar-wrap"><div class="pbar" id="dpbar" style="width:0%"></div></div>
    <div id="daily-tasks"></div>
  </div>
  <div class="page" id="page-weekly">
    <div class="dtabs" id="dtabs"></div>
    <div class="pbar-wrap"><div class="pbar" id="wpbar" style="width:0%"></div></div>
    <div id="weekly-tasks"></div>
  </div>
  <div class="page" id="page-history"><div id="hist-log"></div></div>
  <div class="page" id="page-admin">
    <div id="pin-gate">
      <div class="pin-screen">
        <div class="pin-title">🔒 Admin</div>
        <div class="pin-sub">Enter your PIN to manage tasks and settings</div>
        <div class="pdots" id="pdots"><div class="pdot"></div><div class="pdot"></div><div class="pdot"></div><div class="pdot"></div></div>
        <div class="ppad">
          <button class="pkey" onclick="pp('1')">1</button><button class="pkey" onclick="pp('2')">2</button><button class="pkey" onclick="pp('3')">3</button>
          <button class="pkey" onclick="pp('4')">4</button><button class="pkey" onclick="pp('5')">5</button><button class="pkey" onclick="pp('6')">6</button>
          <button class="pkey" onclick="pp('7')">7</button><button class="pkey" onclick="pp('8')">8</button><button class="pkey" onclick="pp('9')">9</button>
          <button class="pkey" style="visibility:hidden"></button><button class="pkey" onclick="pp('0')">0</button><button class="pkey" onclick="pd()">⌫</button>
        </div>
        <div class="perr" id="perr"></div>
      </div>
    </div>
    <div id="adm-content" style="display:none" class="adm">
      <div class="asec"><div class="asec-hdr"><div class="asec-title">Google Account</div></div><div id="auth-ui"></div></div>
      <div class="asec"><div class="asec-hdr"><div class="asec-title">Daily Tasks</div><button class="addbtn" onclick="openModal('task','daily',null)">+ Add</button></div><div id="adm-daily"></div></div>
      <div class="asec"><div class="asec-hdr"><div class="asec-title">Weekly Tasks</div><button class="addbtn" onclick="openModal('task','weekly',null)">+ Add</button></div><div id="adm-weekly"></div></div>
      <div class="asec"><div class="asec-hdr"><div class="asec-title">Team Members</div><button class="addbtn" onclick="openModal('member',null,null)">+ Add</button></div><div id="adm-members"></div></div>
      <div class="asec"><div class="asec-hdr"><div class="asec-title">Ski Names</div><button class="addbtn" onclick="saveSkiNames()">Save</button></div><div class="sgrid" id="adm-skinames"></div></div>
      <div class="asec">
        <div class="asec-title" style="margin-bottom:10px">Settings</div>
        <button class="abtn" onclick="openModal('pin',null,null)">🔑 Change PIN</button>
        <button class="abtn" onclick="manualSync()">🔄 Force Sync</button>
        <a class="abtn" href="https://docs.google.com/spreadsheets/d/1lM75upNKgGPOhTDkB_FxGhDBrJQX-fwRfblPQD86AM0" target="_blank">📊 Open Google Sheet</a>
      </div>
      <button class="alogout" onclick="adminLogout()">🔒 Lock Admin</button>
    </div>
  </div>
</div>

<div class="bnav">
  <button class="nbtn active" id="nav-daily" onclick="showPage('daily')"><span class="nicon">☀️</span><span class="nlbl">Daily</span></button>
  <button class="nbtn" id="nav-weekly" onclick="showPage('weekly')"><span class="nicon">📋</span><span class="nlbl">Weekly</span></button>
  <button class="nbtn" id="nav-history" onclick="showPage('history')"><span class="nicon">🗂</span><span class="nlbl">History</span></button>
  <button class="nbtn" id="nav-admin" onclick="showPage('admin')"><span class="nicon">⚙️</span><span class="nlbl">Admin</span></button>
</div>

<div class="moverlay" id="moverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal"><div class="mtitle" id="mtitle"></div><div id="mbody"></div>
    <div class="macts"><button class="mcancel" onclick="closeModal()">Cancel</button><button class="msave" onclick="modalSave()">Save</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

// ── STORAGE ───────────────────────────────────────────────────────────────────
function ls(k,v){
  if(v===undefined){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
  else localStorage.setItem(k,JSON.stringify(v));
}
function saveLocal(){ ls('jso',APP); }
function loadLocal(){
  var d=ls('jso');
  if(d){
    APP.dailyTasks  = d.dailyTasks  && d.dailyTasks.length  ? d.dailyTasks  : DD;
    APP.weeklyTasks = d.weeklyTasks && d.weeklyTasks.length ? d.weeklyTasks : WD;
    APP.members     = d.members     && d.members.length     ? d.members     : DM;
    APP.skiNames    = d.skiNames    && d.skiNames.length    ? d.skiNames    : DSN;
    APP.pin         = d.pin  || '1234';
    APP.completions = d.completions || {};
    APP.history     = d.history     || [];
  } else {
    APP.dailyTasks=DD; APP.weeklyTasks=WD;
    APP.members=DM; APP.skiNames=DSN;
  }
}

function todayKey(){ return new Date().toISOString().slice(0,10); }
function weekKey(){
  var d=new Date(), j=new Date(d.getFullYear(),0,1);
  return d.getFullYear()+'-W'+Math.ceil(((d-j)/86400000+j.getDay()+1)/7);
}
function todayDayName(){ return DMAP[new Date().getDay()]; }
function ck(type,sub,id){ return type+':'+sub+':'+id; }

// ── GOOGLE OAUTH ──────────────────────────────────────────────────────────────
function initGoogleAuth(){
  try {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: onToken
    });
  } catch(e) {
    console.error('initTokenClient error', e);
    setSyn('err','Auth init failed');
    return;
  }
  var saved = ls('jso_tok');
  if(saved){ TOKEN=saved; initSheet(); }
  else { setSyn('err','Tap to sign in'); showAuthScreen(); }
}

function onToken(resp){
  if(resp.error){ console.error(resp); setSyn('err','Auth failed'); return; }
  TOKEN=resp.access_token; ls('jso_tok',TOKEN);
  setSyn('spin','Loading…');
  initSheet();
}

function signIn(){
  if(!tokenClient){ setSyn('err','Not ready'); return; }
  tokenClient.requestAccessToken({prompt:''});
}

function signOut(){
  TOKEN=null; ls('jso_tok',null);
  setSyn('err','Tap to sign in');
  updateAuthUI(); showAuthScreen();
}

function showAuthScreen(){
  document.getElementById('daily-tasks').innerHTML =

// ── SHEETS ────────────────────────────────────────────────────────────────────
var BASE = 'https://sheets.googleapis.com/v4/spreadsheets/'+SHEET_ID;

function authHdr(){ return {Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'}; }

async function sGet(range){
  var r=await fetch(BASE+'/values/'+encodeURIComponent(range),{headers:{Authorization:'Bearer '+TOKEN}});
  if(!r.ok) throw new Error('Read failed '+r.status);
  var d=await r.json(); return d.values||[];
}
async function sPut(range,values){
  await fetch(BASE+'/values/'+encodeURIComponent(range)+'?valueInputOption=RAW',{method:'PUT',headers:authHdr(),body:JSON.stringify({values:values})});
}
async function sClear(tab){
  await fetch(BASE+'/values/'+encodeURIComponent(tab)+':clear',{method:'POST',headers:authHdr()});
}
async function sAppend(range,values){
  await fetch(BASE+'/values/'+encodeURIComponent(range)+':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',{method:'POST',headers:authHdr(),body:JSON.stringify({values:values})});
}

async function initSheet(){
  if(!TOKEN) return;
  setSyn('spin','Connecting…');
  try {
    var meta=await fetch(BASE,{headers:{Authorization:'Bearer '+TOKEN}});
    var md=await meta.json();
    var existing=(md.sheets||[]).map(function(s){return s.properties.title;});
    var need=['Daily Tasks','Weekly Tasks','Members','Ski Names','Completions','History','Config'];
    var create=need.filter(function(t){return existing.indexOf(t)===-1;});
    if(create.length){
      await fetch(BASE+':batchUpdate',{method:'POST',headers:authHdr(),
        body:JSON.stringify({requests:create.map(function(t){return {addSheet:{properties:{title:t}}};})})});
    }
    await pullSheets();
    setSyn('ok','Synced');
    renderAll(); updateAuthUI();
    toast('Connected ✓');
  } catch(e){ console.error(e); setSyn('err','Sheet error'); renderAll(); updateAuthUI(); }
}

async function pullSheets(){
  var dt=await sGet('Daily Tasks!A1:D100');
  if(dt.length>1) APP.dailyTasks=dt.slice(1).filter(function(r){return r[0];}).map(function(r){return {id:r[0],name:r[1]||'',note:r[2]||'',freq:r[3]||'Daily · Morning'};});

  var wt=await sGet('Weekly Tasks!A1:F100');
  if(wt.length>1) APP.weeklyTasks=wt.slice(1).filter(function(r){return r[0];}).map(function(r){return {id:r[0],name:r[1]||'',note:r[2]||'',day:r[3]||'Monday',engineHours:r[4]==='true'};});

  var mb=await sGet('Members!A1:A50');
  if(mb.length>1) APP.members=mb.slice(1).map(function(r){return r[0];}).filter(Boolean);

  var sn=await sGet('Ski Names!A1:B30');
  if(sn.length>1) APP.skiNames=sn.slice(1).map(function(r){return r[1]||r[0]||'';});

  var cfg=await sGet('Config!A1:B20');
  if(cfg.length){var m={};cfg.forEach(function(r){m[r[0]]=r[1];});if(m.pin)APP.pin=m.pin;}

  var today=todayKey(), wk=weekKey();
  var co=await sGet('Completions!A1:D5000');
  APP.completions={};
  if(co.length>1) co.slice(1).forEach(function(r){
    if(r[0]&&(r[0].indexOf(today)!==-1||r[0].indexOf(wk)!==-1)) APP.completions[r[0]]={who:r[1],time:r[2],hj:r[3]||''};
  });

  var ht=await sGet('History!A1:F300');
  if(ht.length>1) APP.history=ht.slice(1).slice(0,200).map(function(r){return {date:r[0],time:r[1],taskId:r[2],taskName:r[3],who:r[4],type:r[5]||''};});

  saveLocal();

  // push defaults if sheet was empty
  if(dt.length<=1&&mb.length<=1) await pushDefaults();
}

async function pushDefaults(){
  await sPut('Daily Tasks!A1',[['id','name','note','freq']].concat(APP.dailyTasks.map(function(t){return [t.id,t.name,t.note||'',t.freq];})));
  await sPut('Weekly Tasks!A1',[['id','name','note','day','engineHours']].concat(APP.weeklyTasks.map(function(t){return [t.id,t.name,t.note||'',t.day,t.engineHours?'true':'false'];})));
  await sPut('Members!A1',[['name']].concat(APP.members.map(function(m){return [m];})));
  await sPut('Ski Names!A1',[['number','name']].concat(APP.skiNames.map(function(n,i){return [i+1,n];})));
  await sPut('Config!A1',[['pin',APP.pin]]);
}

async function pushTab(type){
  if(!TOKEN) return;
  if(type==='daily'){
    await sClear('Daily Tasks');
    await sPut('Daily Tasks!A1',[['id','name','note','freq']].concat(APP.dailyTasks.map(function(t){return [t.id,t.name,t.note||'',t.freq];})));
  } else {
    await sClear('Weekly Tasks');
    await sPut('Weekly Tasks!A1',[['id','name','note','day','engineHours']].concat(APP.weeklyTasks.map(function(t){return [t.id,t.name,t.note||'',t.day,t.engineHours?'true':'false'];})));
  }
}
async function pushMembers(){
  if(!TOKEN) return;
  await sClear('Members'); await sPut('Members!A1',[['name']].concat(APP.members.map(function(m){return [m];})));
}
async function pushSkiNames2(){
  if(!TOKEN) return;
  await sClear('Ski Names'); await sPut('Ski Names!A1',[['number','name']].concat(APP.skiNames.map(function(n,i){return [i+1,n];})));
}
async function pushConfig(){
  if(!TOKEN) return;
  await sPut('Config!A1',[['pin',APP.pin]]);
}
async function appendComp(key,who,time,hj){
  if(!TOKEN) return;
  await sAppend('Completions!A1',[[key,who,time,hj||'']]);
}
async function appendHist(e){
  if(!TOKEN) return;
  await sAppend('History!A1',[[e.date,e.time,e.taskId,e.taskName,e.who,e.type||'']]);
}
async function pushAllComps(){
  if(!TOKEN) return;
  await sClear('Completions');
  var rows=Object.keys(APP.completions).map(function(k){var v=APP.completions[k];return [k,v.who,v.time,v.hj||''];});
  if(rows.length) await sPut('Completions!A1',[['key','who','time','hours']].concat(rows));
}

function setSyn(state,lbl){
  document.getElementById('sdot').className='sdot '+(state||'');
  document.getElementById('slbl').textContent=lbl;
}
async function manualSync(){
  if(!TOKEN){signIn();return;}
  setSyn('spin','Syncing…');

  catch(e){setSyn('err','Failed');}

// ── SIGN OFF ──────────────────────────────────────────────────────────────────
async function doSignOff(taskId,type,sub,taskName,who,hj){
  var time=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  var key=ck(type,sub,taskId);
  APP.completions[key]={who:who,time:time,hj:hj||''};
  var entry={date:todayKey(),time:time,taskId:taskId,taskName:taskName,who:who,type:type};
  APP.history.unshift(entry);
  if(APP.history.length>500) APP.history=APP.history.slice(0,500);
  saveLocal(); renderAll();
  setSyn('spin','Saving…');
  await appendComp(key,who,time,hj||'');
  await appendHist(entry);
  setSyn('ok','Synced');
}
async function undoTask(taskId,type,sub){
  delete APP.completions[ck(type,sub,taskId)];
  saveLocal(); renderAll();
  setSyn('spin','Saving…');
  await pushAllComps();
  setSyn('ok','Synced');
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function fcomps(type,sub){
  var px=type+':'+sub+':',out={};
  Object.keys(APP.completions).forEach(function(k){
    if(k.indexOf(px)===0) out[k.split(':').pop()]=APP.completions[k];
  });
  return out;
}

// ── RENDER DAILY ──────────────────────────────────────────────────────────────
function renderDaily(){
  if(!TOKEN){showAuthScreen();return;}
  var sub=todayKey(), comps=fcomps('daily',sub), tasks=APP.dailyTasks;
  var done=Object.keys(comps).length;
  document.getElementById('dpbar').style.width=(tasks.length?Math.round(done/tasks.length*100):0)+'%';
  var secs=[{t:'Morning Tasks',f:'Morning'},{t:'Evening Tasks',f:'Evening'}];
  var html='';
  secs.forEach(function(s){
    var list=tasks.filter(function(t){return t.freq.indexOf(s.f)!==-1;});
    if(!list.length) return;
    var sd=list.filter(function(t){return comps[t.id];}).length;
    html+='<div class="sec"><div class="sec-hdr"><span class="sec-title">'+s.t+'</span><span class="sec-prog">'+sd+'/'+list.length+'</span></div>';
    list.forEach(function(t){html+=cardHTML(t,'daily',sub,comps[t.id]);});
    html+='</div>';
  });
  document.getElementById('daily-tasks').innerHTML=html;
}

// ── RENDER WEEKLY ─────────────────────────────────────────────────────────────
function renderWeekly(){
  if(!TOKEN){document.getElementById('weekly-tasks').innerHTML='';document.getElementById('dtabs').innerHTML='';return;}
  var tn=todayDayName();
  if(!selDay) selDay=WDAYS.indexOf(tn)!==-1?tn:WDAYS[0];
  var tabsHtml=WDAYS.map(function(d){
    return '<button class="dtab'+(d===selDay?' active':'')+(d===tn?' today':'')+'" onclick="selD(\''+d+'\')">'+d.slice(0,3)+'</button>';
  }).join('');
  document.getElementById('dtabs').innerHTML=tabsHtml;
  var sub=weekKey()+':'+selDay;
  var tasks=APP.weeklyTasks.filter(function(t){return t.day===selDay;});
  var comps=fcomps('weekly',sub);
  var done=Object.keys(comps).length;
  document.getElementById('wpbar').style.width=(tasks.length?Math.round(done/tasks.length*100):0)+'%';
  if(!tasks.length){document.getElementById('weekly-tasks').innerHTML='<div class="empty">No tasks for '+selDay+'.</div>';return;}
  var html='<div class="sec">';
  tasks.forEach(function(t){html+=cardHTML(t,'weekly',sub,comps[t.id]);});
  html+='</div>';
  document.getElementById('weekly-tasks').innerHTML=html;
}
function selD(d){selDay=d;renderWeekly();}

function cardHTML(task,type,sub,comp){
  var isDone=!!comp;
  var sn=task.name.replace(/'/g,"\\'").replace(/"/g,'&quot;');
  var nbtns=APP.members.map(function(n){
    return '<button class="nbtn" onclick="selName(\''+task.id+'\',\''+type+'\',\''+sub+'\',\''+sn+'\',\''+n+'\',this)">'+n+'</button>';
  }).join('');
  var hgrid=task.engineHours?buildHGrid(task.id,isDone,comp):'';
  var meta=isDone?'✓ '+comp.who+' · '+comp.time:(task.freq||task.day||'');
  return '<div class="card'+(isDone?' done':'')+'" id="card-'+task.id+'">'+
    '<div class="card-row" onclick="tog(\''+task.id+'\')">'+
    '<div class="chk">'+(isDone?'✓':'')+'</div>'+
    '<div class="ci"><div class="cn">'+task.name+'</div><div class="cm">'+meta+'</div></div>'+
    '<div class="caret">⌄</div></div>'+
    '<div class="detail" id="det-'+task.id+'">'+
    '<div class="dnote">'+(task.note||'')+'</div>'+hgrid+
    '<div class="slbl">Sign Off</div>'+
    (isDone
      ? '<div class="dby">✅ '+comp.who+' · '+comp.time+'</div><button class="undobtn" onclick="undoTask(\''+task.id+'\',\''+type+'\',\''+sub+'\')">Undo Sign-Off</button>'
      : '<div class="npicker" id="np-'+task.id+'">'+nbtns+'</div><button class="cfmbtn" id="cfm-'+task.id+'"></button>'
    )+'</div></div>';
}

function buildHGrid(tid,isDone,comp){
  var hours={};
  if(isDone&&comp&&comp.hj){try{hours=JSON.parse(comp.hj);}catch(e){}}
  var h='<div class="hgrid">';
  for(var i=1;i<=25;i++){
    h+='<div class="hbox"><div class="hlbl">'+(APP.skiNames[i-1]||'Ski '+i)+'</div>'+
      '<input class="hinp" id="hr-'+tid+'-'+i+'" type="number" inputmode="decimal" placeholder="—" value="'+(hours[i]||'')+'"'+(isDone?' disabled':'')+'/></div>';
  }
  return h+'</div>';
}

function getHours(tid){
  var h={};
  for(var i=1;i<=25;i++){var el=document.getElementById('hr-'+tid+'-'+i);if(el&&el.value)h[i]=el.value;}
  return Object.keys(h).length?JSON.stringify(h):'';
}

function tog(id){document.getElementById('card-'+id).classList.toggle('open');}

function selName(tid,type,sub,taskName,name,btn){
  var np=document.getElementById('np-'+tid);
  np.querySelectorAll('.nbtn').forEach(function(b){b.classList.remove('sel');});
  btn.classList.add('sel');
  var cb=document.getElementById('cfm-'+tid);
  cb.className='cfmbtn show'; cb.textContent='✓ Sign off as '+name;
  var task=APP.dailyTasks.concat(APP.weeklyTasks).filter(function(t){return t.id===tid;})[0];
  cb.onclick=function(){doSignOff(tid,type,sub,taskName,name,task&&task.engineHours?getHours(tid):'');};
}

    } else {
      body.innerHTML='<div class="flbl">Task Name</div><input class="finp" id="mn" value="'+(task?task.name:'')+'" placeholder="Task name">'+

        '<div class="flbl">Day</div><select class="fsel" id="mday">'+WDAYS.map(function(d){return '<option value="'+d+'"'+(task&&task.day===d?' selected':'')+'>'+d+'</option>';}).join('')+'</select>'+

    }
  } else if(type==='member'){
    body.innerHTML='<div class="flbl">Name</div><input class="finp" id="mm" placeholder="e.g. Marcus" autocorrect="off">';
  } else {
    body.innerHTML='<div class="flbl">New PIN (4 digits)</div><input class="finp" id="mp1" type="tel" maxlength="4" placeholder="e.g. 5678" inputmode="numeric">'+
      '<div class="flbl">Confirm PIN</div><input class="finp" id="mp2" type="tel" maxlength="4" placeholder="Repeat PIN" inputmode="numeric">';
  }
  document.getElementById('moverlay').classList.add('open');
  setTimeout(function(){var f=body.querySelector('input,textarea');if(f)f.focus();},150);
}
function closeModal(){document.getElementById('moverlay').classList.remove('open');_ctx={};}

async function modalSave(){
  var type=_ctx.type,subtype=_ctx.subtype,id=_ctx.id;
  if(type==='task'){
    var name=(document.getElementById('mn')||{}).value.trim();
    var note=(document.getElementById('mnote')||{}).value.trim();
    if(!name){document.getElementById('mn').style.borderColor='var(--red)';return;}
    if(subtype==='daily'){
      var freq=document.getElementById('mfreq').value;
      if(id){var t=APP.dailyTasks.filter(function(t){return t.id===id;})[0];t.name=name;t.note=note;t.freq=freq;}
      else APP.dailyTasks.push({id:'d'+Date.now().toString(36),name:name,note:note,freq:freq});
    } else {
      var day=document.getElementById('mday').value;
      var eh=document.getElementById('meh').value==='true';
      if(id){var t=APP.weeklyTasks.filter(function(t){return t.id===id;})[0];t.name=name;t.note=note;t.day=day;t.engineHours=eh;}
      else APP.weeklyTasks.push({id:'w'+Date.now().toString(36),name:name,note:note,day:day,engineHours:eh});
    }
    closeModal(); saveLocal(); renderAdmin(); renderAll();
    setSyn('spin','Saving…'); await pushTab(subtype); setSyn('ok','Synced');
  } else if(type==='member'){
    var nm=(document.getElementById('mm')||{}).value.trim();
    if(!nm){document.getElementById('mm').style.borderColor='var(--red)';return;}
    if(APP.members.indexOf(nm)===-1) APP.members.push(nm);
    closeModal(); saveLocal(); renderAdmin(); renderAll();
    setSyn('spin','Saving…'); await pushMembers(); setSyn('ok','Synced');
  } else {
    var p1=document.getElementById('mp1').value.trim(), p2=document.getElementById('mp2').value.trim();
    if(!/^\d{4}$/.test(p1)){alert('PIN must be 4 digits.');return;}
    if(p1!==p2){alert('PINs do not match.');return;}
    APP.pin=p1; closeModal(); saveLocal(); toast('PIN updated');
    setSyn('spin','Saving…'); await pushConfig(); setSyn('ok','Synced');
  }
}

// ── PIN ───────────────────────────────────────────────────────────────────────
function pp(d){if(_pin.length>=4)return;_pin+=d;updDots();if(_pin.length===4)setTimeout(chkPin,120);}
function pd(){_pin=_pin.slice(0,-1);updDots();}
function updDots(state){
  var dots=document.querySelectorAll('.pdot');
  for(var i=0;i<dots.length;i++){
    dots[i].classList.toggle('f',i<_pin.length);
    dots[i].classList.toggle('e',state==='err');
  }
}
function chkPin(){
  if(_pin===APP.pin){
    _pin=''; updDots();
    document.getElementById('pin-gate').style.display='none';
    document.getElementById('adm-content').style.display='block';
    renderAdmin();
    document.getElementById('perr').textContent='';
  } else {
    updDots('err');
    document.getElementById('perr').textContent='Incorrect PIN. Try again.';
    setTimeout(function(){_pin='';updDots();document.getElementById('perr').textContent='';},1000);
  }
}
function adminLogout(){
  _pin=''; updDots();
  document.getElementById('adm-content').style.display='none';
  document.getElementById('pin-gate').style.display='block';
}

// ── NAV ───────────────────────────────────────────────────────────────────────
function showPage(page){
  ['daily','weekly','history','admin'].forEach(function(p){
    document.getElementById('page-'+p).classList.toggle('active',p===page);
    document.getElementById('tab-'+p).classList.toggle('active',p===page);
    document.getElementById('nav-'+p).classList.toggle('active',p===page);
  });
}

function renderAll(){renderDaily();renderWeekly();renderHistory();}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}

// ── INIT ──────────────────────────────────────────────────────────────────────
loadLocal();
renderAll();

function waitGoogle(cb,n){
  n=n||0;
  if(typeof google!=='undefined'&&google&&google.accounts&&google.accounts.oauth2){cb();}
  else if(n<40){setTimeout(function(){waitGoogle(cb,n+1);},200);}
  else{setSyn('err','Google failed to load');}
}

window.addEventListener('load',function(){
  waitGoogle(initGoogleAuth);
});
</script>
